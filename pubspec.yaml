name: al_mizan
description: "Al-Mizan — A premium Arabic Grammar (Sarf & Nahw) learning experience."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — clean, scalable, testable.
  flutter_riverpod: ^2.5.1

  # Typography: Amiri / Scheherazade New (Arabic) + Inter (English).
  google_fonts: ^6.2.1

  # Premium iconography (custom-feel, not stock Material).
  phosphor_flutter: ^2.1.0

  # Lightweight, declarative implicit/explicit animations.
  flutter_animate: ^4.5.0

  # Localization scaffolding for RTL/LTR.
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # NOTE: Add font asset files under assets/fonts/ if you prefer bundling
  # over google_fonts. google_fonts fetches Amiri, Scheherazade New, and
  # Inter at runtime/caches them, so no asset declaration is required to start.
